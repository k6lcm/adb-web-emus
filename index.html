<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="A desktop of vintage computer emulators that run in your browser.">
  <title>ADB Web Emulators</title>
  <link rel="icon" href="icons/favicon.png" type="image/png">
  <link rel="stylesheet" href="css/desktop.css">
  <script type="module" src="js/desktop.js"></script>
</head>
<body>
  <header id="topbar">
    <div class="topbar-start">
      <button id="tray-btn" class="topbar-pill brand-menu" type="button" aria-haspopup="menu" aria-controls="system-menu" aria-expanded="false" aria-label="Adrian's Digital Basement menu" title="Adrian's Digital Basement">
        <svg viewBox="0 0 64 80" aria-hidden="true">
          <path fill="currentColor" fill-rule="evenodd" d="M32 3 61 29v20L32 76 3 49V29Z M7 29 32 7v19L17 39Z M38 37a6 6 0 1 0-12 0 6 6 0 0 0 12 0Z M4 29l28 25.2L60 29v1.8L32.8 55.1V74h-1.6V55.1L4 30.8Z"/>
        </svg>
      </button>
    </div>
    <div class="topbar-center">
      <time id="clock" class="topbar-pill"></time>
    </div>
  </header>

  <main id="desktop">
    <div id="desktop-icons" role="group" aria-label="Emulators"></div>
    <div id="windows"></div>
    <p id="desktop-message" hidden></p>
  </main>

  <div id="dock-wrap">
    <nav id="dock" aria-label="Dock">
      <div id="dock-apps"></div>
    </nav>
  </div>
  <div id="dock-reveal" aria-hidden="true"></div>

  <div id="system-menu" hidden role="menu">
    <button type="button" role="menuitem" data-cmd="about">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 7.25v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="4.9" r="1" fill="currentColor"/></svg>
      About
    </button>
    <button type="button" role="menuitem" data-cmd="reset-layout">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2 6h12" stroke="currentColor" stroke-width="1.5"/></svg>
      Reset window layout
    </button>
    <button type="button" role="menuitem" data-cmd="close-all">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      Close all windows
    </button>
  </div>

  <dialog id="about-dialog">
    <form method="dialog" class="about">
      <button class="hb-btn about-close" value="close" aria-label="Close">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
      </button>
      <img src="icons/basement.png" alt="Adrian's Digital Basement logo" width="96" height="127">
      <h2>ADB Web Emulators</h2>
      <p class="about-sub">Vintage computers, running in your browser</p>
      <ul id="about-apps" class="about-list"></ul>
      <p class="about-foot"><a href="https://github.com/k6lcm/adb-web-emus" target="_blank" rel="noopener">Source on GitHub</a></p>
    </form>
  </dialog>

  <template id="window-tpl">
    <section class="window" role="dialog">
      <div class="window-frame">
        <header class="headerbar">
          <div class="hb-start">
            <button class="hb-btn flat" type="button" data-action="reload" title="Restart emulator" aria-label="Restart emulator">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.46-3.54M13 2.75V5.5h-2.75"/></svg>
            </button>
            <button class="hb-btn flat" type="button" data-action="newtab" title="Open in new tab" aria-label="Open in new tab">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 2.75h3.75V6.5M13.25 2.75 7.5 8.5M11.5 9.5v3.75h-8.75V4.5H6.5"/></svg>
            </button>
          </div>
          <div class="hb-title"><img class="hb-icon" alt="" width="18" height="18"><span></span></div>
          <div class="hb-end">
            <button class="hb-btn round" type="button" data-action="minimize" title="Minimize" aria-label="Minimize">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 11h7"/></svg>
            </button>
            <button class="hb-btn round" type="button" data-action="maximize" title="Maximize" aria-label="Maximize">
              <svg class="icon-max" viewBox="0 0 16 16" aria-hidden="true"><rect x="4.25" y="4.25" width="7.5" height="7.5" rx="1"/></svg>
              <svg class="icon-restore" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="5.75" width="6.75" height="6.75" rx="1"/><path d="M6 3.5h5.5a1 1 0 0 1 1 1V10"/></svg>
            </button>
            <button class="hb-btn round" type="button" data-action="close" title="Close" aria-label="Close">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.75 4.75l6.5 6.5M11.25 4.75l-6.5 6.5"/></svg>
            </button>
          </div>
        </header>
        <div class="window-body">
          <iframe allow="autoplay; fullscreen; gamepad; clipboard-write" referrerpolicy="same-origin"></iframe>
        </div>
      </div>
      <div class="rz" data-dir="n"></div><div class="rz" data-dir="s"></div>
      <div class="rz" data-dir="e"></div><div class="rz" data-dir="w"></div>
      <div class="rz" data-dir="ne"></div><div class="rz" data-dir="nw"></div>
      <div class="rz" data-dir="se"></div><div class="rz" data-dir="sw"></div>
    </section>
  </template>
</body>
</html>
