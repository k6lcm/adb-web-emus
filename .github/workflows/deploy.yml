name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Check every app in the manifest is present
        run: |
          jq -e '.apps | length > 0' apps/manifest.json > /dev/null
          status=0
          for p in $(jq -r '.apps[].path' apps/manifest.json); do
            if [ ! -f "$p/index.html" ]; then echo "::error::missing $p/index.html"; status=1; fi
          done
          for i in $(jq -r '.apps[].icon' apps/manifest.json); do
            if [ ! -f "$i" ]; then echo "::error::missing icon $i"; status=1; fi
          done
          exit $status

      # Rule: every change that goes live is stamped with its GMT date and time
      # to the second. The About dialog shows this file. Do not remove this step.
      - name: Record the GMT date and time of this update
        run: |
          jq -n --arg updated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg revision "$GITHUB_SHA" \
            '{updated: $updated, revision: $revision}' > last-updated.json
          cat last-updated.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Wait until the Pages artifact is visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$count" -gt 0 ]; then exit 0; fi
            sleep 3
          done
          echo "Pages artifact is not visible yet."
          exit 1

      - id: deployment
        uses: actions/deploy-pages@v4
